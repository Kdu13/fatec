{% extends "imoveis/base.html" %}

{% block titulo %}Excluir imóvel - Morada Imóveis{% endblock %}

{% block conteudo %}
  <h1>Excluir imóvel</h1>

  <div class="painel">
    <p class="aviso-exclusao">
      Tem certeza de que deseja excluir <strong>{{ imovel.titulo }}</strong>?
      Essa ação não pode ser desfeita.
    </p>

    <form method="post" class="acoes">
      {% csrf_token %}
      <button type="submit" class="btn btn--perigo">Excluir imóvel</button>
      <a href="{% url 'listar_imoveis' %}" class="btn btn--claro">Cancelar</a>
    </form>
  </div>
{% endblock %}
