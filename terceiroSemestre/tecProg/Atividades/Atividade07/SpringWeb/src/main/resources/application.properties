spring.application.name=SpringWeb
server.port=8080

# Banco em memória: os dados existem enquanto a aplicação estiver em execução.
spring.datasource.url=jdbc:h2:mem:springweb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Disponível para desenvolvimento em http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
