<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
          integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <title>Cadastrar Produto</title>
    <style>
        body { background: #f3f6f9; font-family: Arial, sans-serif; }
        .container { max-width: 760px; }
        .card { border: 0; border-radius: 10px; box-shadow: 0 3px 14px #00000012; }
        h1 { color: #17324d; }
    </style>
</head>
<body>
<main class="container mt-5">
    <h1 class="mb-4">Cadastrar Produto</h1>
    <div class="card"><div class="card-body">
        <div class="alert alert-danger" role="alert" th:if="${erro}" th:text="${erro}"></div>
        <!-- O formulário envia os dados para o Controller associados ao objeto produto. -->
        <form th:action="@{/cadastrar}" th:object="${produto}" method="post">
            <div class="form-group">
                <label for="nome">Nome</label>
                <input class="form-control" type="text" th:field="*{nome}" placeholder="Ex.: Camiseta" required>
            </div>
            <div class="form-group">
                <label for="preco">Preço (R$)</label>
                <input class="form-control" type="number" th:field="*{preco}" step="0.01" min="0" placeholder="Ex.: 49.90" required>
            </div>
            <div class="form-group">
                <label for="categoria">Categoria</label>
                <select class="form-control" th:field="*{categoria}" required>
                    <option value="" disabled>Selecione uma categoria</option>
                    <option th:each="categoria : ${categorias}" th:value="${categoria}" th:text="${categoria}"></option>
                </select>
            </div>
            <div class="form-group">
                <label for="descricao">Descrição</label>
                <textarea class="form-control" th:field="*{descricao}" rows="3" placeholder="Detalhes do produto"></textarea>
            </div>
            <button class="btn btn-primary" type="submit">Cadastrar</button>
        </form>
        <a th:href="@{/lista}" class="btn btn-outline-secondary mt-3">Ver lista de produtos</a>
    </div></div>
</main>
</body>
</html>
