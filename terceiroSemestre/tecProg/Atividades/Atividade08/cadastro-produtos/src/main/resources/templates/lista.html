<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
          integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <title>Lista de Produtos</title>
    <style>
        body { background: #f3f6f9; font-family: Arial, sans-serif; }
        .container { max-width: 1100px; }
        .card { border: 0; border-radius: 10px; box-shadow: 0 3px 14px #00000012; }
        h1 { color: #17324d; }
    </style>
</head>
<body>
<main class="container mt-5">
    <h1 class="mb-4">Lista de Produtos</h1>
    <div class="card"><div class="card-body">
        <form class="form-inline mb-4" th:action="@{/lista}" method="get">
            <label class="sr-only" for="busca">Buscar produto</label>
            <input class="form-control mr-2 mb-2" id="busca" name="busca" type="search"
                   placeholder="Nome ou categoria" th:value="${busca}">
            <button class="btn btn-primary mb-2" type="submit">Buscar</button>
            <a class="btn btn-outline-secondary ml-2 mb-2" th:href="@{/lista}">Limpar</a>
        </form>

        <div class="alert alert-info" role="alert" th:if="${#lists.isEmpty(produtos)}">
            Nenhum produto encontrado.
        </div>
        <div class="table-responsive" th:unless="${#lists.isEmpty(produtos)}">
            <table class="table table-striped table-bordered">
                <thead class="thead-dark"><tr>
                    <th>#</th><th>Nome</th><th>Descrição</th><th>Preço</th><th>Categoria</th><th>Ações</th>
                </tr></thead>
                <tbody>
                <!-- iterStat fornece a posição de cada produto na tabela. -->
                <tr th:each="produto, iterStat : ${produtos}">
                    <td th:text="${iterStat.count}">1</td>
                    <td th:text="${produto.nome}">Nome</td>
                    <td th:text="${#strings.isEmpty(produto.descricao) ? '-' : produto.descricao}">Descrição</td>
                    <td th:text="${'R$ ' + #numbers.formatDecimal(produto.preco, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</td>
                    <td th:text="${produto.categoria}">Categoria</td>
                    <td>
                        <form th:action="@{/remover/{id}(id=${produto.id})}" method="post">
                            <button class="btn btn-sm btn-danger" type="submit">Remover</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <p class="text-muted" th:text="${totalProdutos} + ' produto(s) cadastrado(s) no total'"></p>
        <a th:href="@{/cadastrar}" class="btn btn-primary">+ Cadastrar novo produto</a>
    </div></div>
</main>
</body>
</html>
